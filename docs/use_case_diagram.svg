<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6" fill-opacity="0.7"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="660" fill="#F8FBFF" rx="8"/>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F4E79">Диаграмма вариантов использования</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#2E75B6">Шифр Билайна (Rail Fence Cipher) — Вариант 13</text>

  <!-- ══════════════ System boundary ══════════════ -->
  <rect x="220" y="75" width="620" height="520" rx="12" fill="#EBF3FB" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E79">Система шифрования Rail Fence</text>

  <!-- ══════════════ Actor ══════════════ -->
  <!-- Head -->
  <circle cx="90" cy="200" r="22" fill="#D6E4F0" stroke="#1F4E79" stroke-width="2"/>
  <!-- Body -->
  <line x1="90" y1="222" x2="90" y2="280" stroke="#1F4E79" stroke-width="2"/>
  <!-- Arms -->
  <line x1="55" y1="248" x2="125" y2="248" stroke="#1F4E79" stroke-width="2"/>
  <!-- Legs -->
  <line x1="90" y1="280" x2="60" y2="320" stroke="#1F4E79" stroke-width="2"/>
  <line x1="90" y1="280" x2="120" y2="320" stroke="#1F4E79" stroke-width="2"/>
  <!-- Label -->
  <text x="90" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">Пользователь</text>

  <!-- ══════════════ Use Cases ══════════════ -->
  <!-- UC1: Ввести исходный текст -->
  <ellipse cx="430" cy="155" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="159" text-anchor="middle" font-size="12" fill="#1a1a1a">Ввести исходный текст</text>

  <!-- UC2: Задать количество рельсов -->
  <ellipse cx="430" cy="230" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="234" text-anchor="middle" font-size="12" fill="#1a1a1a">Задать количество рельсов</text>

  <!-- UC3: Зашифровать текст -->
  <ellipse cx="430" cy="310" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="314" text-anchor="middle" font-size="12" fill="#1a1a1a">Зашифровать текст</text>

  <!-- UC4: Расшифровать текст -->
  <ellipse cx="430" cy="390" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="394" text-anchor="middle" font-size="12" fill="#1a1a1a">Расшифровать текст</text>

  <!-- UC5: Визуализировать заполнение -->
  <ellipse cx="430" cy="470" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="466" text-anchor="middle" font-size="12" fill="#1a1a1a">Визуализировать</text>
  <text x="430" y="480" text-anchor="middle" font-size="12" fill="#1a1a1a">заполнение (забор)</text>

  <!-- UC6: Скопировать результат -->
  <ellipse cx="430" cy="545" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="541" text-anchor="middle" font-size="12" fill="#1a1a1a">Скопировать результат</text>
  <text x="430" y="555" text-anchor="middle" font-size="12" fill="#1a1a1a">в буфер обмена</text>

  <!-- UC7: Очистить все поля -->
  <ellipse cx="670" cy="545" rx="130" ry="28" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="549" text-anchor="middle" font-size="12" fill="#1a1a1a">Очистить все поля</text>

  <!-- UC8: Валидация входных данных -->
  <ellipse cx="720" cy="340" rx="140" ry="28" fill="#FFF3CD" stroke="#C8A800" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="344" text-anchor="middle" font-size="12" fill="#1a1a1a">Валидация входных данных</text>

  <!-- ══════════════ Arrows: Actor → UC ══════════════ -->
  <!-- Actor → UC1 -->
  <line x1="112" y1="187" x2="297" y2="157" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Actor → UC2 -->
  <line x1="112" y1="210" x2="297" y2="230" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Actor → UC3 -->
  <line x1="112" y1="230" x2="297" y2="305" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Actor → UC4 -->
  <line x1="112" y1="248" x2="297" y2="385" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Actor → UC5 -->
  <line x1="112" y1="265" x2="297" y2="465" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Actor → UC6 -->
  <line x1="112" y1="275" x2="297" y2="542" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Actor → UC7 (long arrow to right side) -->
  <line x1="112" y1="282" x2="537" y2="545" stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══════════════ include / extend relationships ══════════════ -->
  <!-- UC3 --include--> UC8 -->
  <line x1="560" y1="310" x2="576" y2="330" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="640" y="315" text-anchor="middle" font-size="11" fill="#2E75B6" font-style="italic">«include»</text>

  <!-- UC4 --include--> UC8 -->
  <line x1="560" y1="390" x2="577" y2="362" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="638" y="383" text-anchor="middle" font-size="11" fill="#2E75B6" font-style="italic">«include»</text>

  <!-- UC5 --extend--> UC3 -->
  <line x1="430" y1="442" x2="430" y2="338" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="394" y="395" text-anchor="middle" font-size="11" fill="#2E75B6" font-style="italic">«extend»</text>

  <!-- ══════════════ Note for UC8 (Validation) ══════════════ -->
  <rect x="730" y="200" width="178" height="100" rx="6" fill="#FFF9C4" stroke="#C8A800" stroke-width="1.5"/>
  <text x="740" y="220" font-size="11" fill="#333">Проверяется:</text>
  <text x="740" y="238" font-size="11" fill="#333">• текст не пустой / null</text>
  <text x="740" y="256" font-size="11" fill="#333">• число рельсов ≥ 2</text>
  <text x="740" y="274" font-size="11" fill="#333">• рельсов &lt; длины текста</text>
  <!-- Note connector -->
  <line x1="819" y1="300" x2="819" y2="312" stroke="#C8A800" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════════════ Note for UC5 (Visualization) ══════════════ -->
  <rect x="232" y="510" width="190" height="76" rx="6" fill="#FFF9C4" stroke="#C8A800" stroke-width="1.5"/>
  <text x="242" y="528" font-size="11" fill="#333">Матрица-забор:</text>
  <text x="242" y="546" font-size="11" fill="#333">символы зигзагом по</text>
  <text x="242" y="562" font-size="11" fill="#333">рельсам, пустые — "·"</text>
  <!-- Note connector -->
  <line x1="327" y1="510" x2="390" y2="498" stroke="#C8A800" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
