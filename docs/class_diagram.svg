<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="820" viewBox="0 0 1020 820" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow-use" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="none" stroke="#1F4E79" stroke-width="1"/>
    </marker>
    <marker id="arrow-solid" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1F4E79"/>
    </marker>
    <marker id="arrow-inherit" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="white" stroke="#1F4E79" stroke-width="1.5"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1020" height="820" fill="#F0F6FF" rx="8"/>

  <!-- Title -->
  <text x="510" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4E79">Диаграмма классов — Шифр Билайна (Rail Fence, Вариант 13)</text>

