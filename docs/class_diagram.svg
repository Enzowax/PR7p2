  <rect x="14" y="50" width="370" height="280" rx="8" fill="#EBF3FB" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="24" y="68" font-size="11" fill="#2E75B6" font-style="italic">RailFenceCipher (логика)</text>

  <!-- Class: RailFenceCipherLogic -->
  <rect x="30" y="78" width="340" height="230" rx="6" fill="white" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
