  <text x="42" y="271" font-size="10" fill="#333">Throws: ArgumentNullException</text>
  <text x="42" y="287" font-size="10" fill="#333">ArgumentOutOfRangeException</text>
  <line x1="232" y1="276" x2="260" y2="276" stroke="#C8A800" stroke-width="1" stroke-dasharray="3,2"/>

