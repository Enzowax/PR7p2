  <text x="42" y="712" font-size="10.5" fill="#E53935">+ Encrypt_NegativeRails_Throws...()           TC-18</text>
  <text x="42" y="728" font-size="10.5" fill="#E53935">+ Decrypt_OneRail_Throws...()                 TC-19</text>
  <text x="42" y="744" font-size="10.5" fill="#1976D2">+ BuildFence_ReturnsCorrectMatrix()            TC-20</text>
  <text x="42" y="760" font-size="10.5" fill="#1976D2">+ BuildFence_NullText_Throws...()              TC-21</text>
  <text x="42" y="776" font-size="10.5" fill="#1976D2">+ BuildFence_InvalidRails_Throws...()          TC-22</text>

