  <text x="42" y="170" font-size="11" fill="#1a1a1a">+ «static» Encrypt(text, rails) : string</text>
  <text x="42" y="188" font-size="11" fill="#1a1a1a">+ «static» Decrypt(cipher, rails) : string</text>
  <text x="42" y="206" font-size="11" fill="#1a1a1a">+ «static» BuildFence(text, rails) : char[][]</text>
  <line x1="42" y1="215" x2="360" y2="215" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="42" y="232" font-size="11" fill="#888">— GetRowIndices(length, rails) : int[]</text>

